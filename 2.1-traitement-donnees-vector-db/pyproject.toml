[project]
name = "rag-local"
version = "0.1.0"
description = "Pipeline RAG local pour documents : ingestion, chunking, embeddings, vector DB embarquée"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "duckdb>=2.0",
    "qdrant-client>=1.10",
    "rank-bm25>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true